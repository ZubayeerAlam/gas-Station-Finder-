# FuelWise CI — checks only. Nothing here deploys anything (no Firebase deploy,
# no store upload) and no secrets are needed: tests use fakes and emulators.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  flutter:
    name: Flutter — analyze, test, coverage, APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.5
          cache: true
      - run: flutter pub get
      - name: Generated code is up to date
        run: |
          dart run build_runner build -d
          git diff --exit-code -- '*.freezed.dart' '*.g.dart'
      - run: flutter analyze
      - run: flutter test --coverage
      - name: Domain-layer coverage ≥ 70 %
        run: python3 tool/domain_coverage.py coverage/lcov.info 70
      - uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/lcov.info
      # Debug APK without API keys: proves the Android build; the app shows its
      # "key not configured" state at runtime.
      - run: flutter build apk --debug
      - uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 7

  functions:
    name: Cloud Functions — unit, rules, emulator tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: functions
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: functions/package-lock.json
      - uses: actions/setup-java@v4 # Firestore emulator
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci
      - run: npm install -g firebase-tools
      # Demo project id → the emulators never touch a real Firebase project.
      - run: npm test
